<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IntelliDocs</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            max-width: 800px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .upload-box {
            border: 2px dashed #aaa;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
        }

        input[type="file"] {
            margin: 15px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📄 IntelliDocs</h1>

    <p class="subtitle">
        Intelligent Document Processing & Question Answering
    </p>

    <div class="upload-box">

        <h2>Upload Your Document</h2>

        <p>Supported formats: PDF, DOCX, TXT</p>

        <form action="/upload" method="POST" enctype="multipart/form-data">

            <input type="file" name="document" required>

            <br>

            <button type="submit">
                Upload Document
            </button>

        </form>

    </div>

</div>

</body>
</html>
